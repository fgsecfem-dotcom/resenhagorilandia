<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Ilha do Resenha</title><link rel="stylesheet" href="island.css"></head>
<body><div id="wrap"><div id="isl" class="empty">
<div id="top"><button id="grip" title="Arrastar para outro canto" aria-label="Mover a ilha"></button>
<button id="zp" aria-label="Pessoas na call"><span id="avs"></span></button>
<button id="zm" aria-label="Música"><img id="cv" alt=""><span class="tx"><b id="ti"></b><small id="ar"></small></span></button>
<span id="ctl"><button id="mic" aria-label="Microfone"></button><button id="deaf" aria-label="Fone"></button></span></div>
<div id="hint">Clique na música ou nas pessoas. Solte a tecla para fechar.</div>
<div class="pan" id="pm"><div><div class="in">
<div class="prog"><span id="pos">0:00</span><div class="tr"><div class="fl" id="pf"></div></div><span id="dur">0:00</span></div>
<div class="btns"><button id="prev" aria-label="Voltar"></button><button id="play" class="main" aria-label="Pausar ou tocar"></button><button id="next" aria-label="Pular"></button></div>
<div class="vrow"><span class="ic" id="vic"></span><input type="range" id="mvol" min="0" max="100" step="1" aria-label="Volume da música"><span class="pc" id="mvv"></span></div>
</div></div></div>
<div class="pan" id="pp"><div><div class="in" id="plist"></div></div></div>
</div></div><script src="island.js"></script></body></html>
