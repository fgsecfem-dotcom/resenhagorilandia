<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'"><title>Resenha</title><link rel="stylesheet" href="launcher.css"></head>
<body><main class="launcher-window" aria-labelledby="launcher-status"><div class="wall" aria-hidden="true"><i class="orb a"></i><i class="orb b"></i><i class="orb c"></i></div><header><span>resenha</span><button id="close" aria-label="Fechar janela" title="Fechar janela">×</button></header><section id="status"><div class="mascot-wrap" aria-hidden="true"><span class="ring"></span><div class="mascot" id="mascot"></div></div><div class="status-copy" role="status" aria-live="polite" aria-atomic="true"><h1 id="launcher-status">Verificando atualizações…</h1><p id="description">Buscando as novidades do Resenha</p></div><div class="progress-region"><div id="progress" class="progress indeterminate" role="progressbar" aria-label="Verificação em andamento"><div id="fill"></div></div><div class="numbers"><span id="bytes"></span><span id="percent"></span></div></div><div class="actions"><button id="open" class="text-button" hidden>Abrir versão atual</button><button id="download" class="text-button" hidden>Baixar pelo site</button><button id="retry" class="text-button" hidden>Tentar novamente</button></div><details id="details" hidden><summary>Ver detalhes</summary><p id="error"></p></details></section>
<section id="hub" class="hub" aria-label="Início" hidden>
<div id="notice" class="notice" hidden><span id="notice-text"></span><button id="notice-open" class="text-button" type="button">Ver</button></div>
<div class="greet"><div class="hub-mascot" id="hub-mascot" aria-hidden="true"></div><h2 id="hello">Olá</h2></div>
<form id="join-form" class="join" autocomplete="off"><input id="code" maxlength="9" placeholder="Entrar com o código da sala" spellcheck="false" aria-label="Código da sala"><button type="submit" class="text-button primary">Entrar</button><button type="button" id="host-go" class="text-button">Criar sala</button></form>
<p id="hub-error" class="hub-error" role="alert"></p>
<h3 id="rooms-title" class="rooms-title" hidden>Fixadas e recentes</h3>
<div id="rooms" class="rooms" hidden></div>
<p id="empty" class="empty" hidden>Suas salas aparecem aqui. Crie uma ou entre com um código.</p>
</section>
<footer><span id="version"></span><label class="skip"><input type="checkbox" id="skip"> Abrir direto da próxima vez</label><button id="hub-open" class="text-button" type="button">Abrir Resenha</button><span id="channel"></span></footer></main><script src="themes.js"></script><script src="pipoca.js"></script><script src="launcher.js"></script></body></html>
